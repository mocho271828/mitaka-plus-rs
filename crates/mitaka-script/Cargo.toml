[package]
name = "mitaka-script"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
mitaka-core = { path = "../mitaka-core" }
command-group = "5"
interprocess = "2"
mlua = { version = "0.12.2", features = ["lua54"] }
# build.rs が同梱アーカイブから静的ライブラリを用意する。
mlua-sys = { version = "0.13", features = ["external"] }
serde_json = "1"

[build-dependencies]
cc = "1"
flate2 = "1"
sha2 = "0.10"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
