[package]
name = "mitaka-desktop"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true
default-run = "mitaka-plus"

[[bin]]
name = "mitaka-plus"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
fontdb = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rfd = "0.15"
mitaka-core = { path = "../mitaka-core" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# Windowsの提示経路でもDX12バックエンドを明示する。
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[dev-dependencies]
tempfile = "3"
