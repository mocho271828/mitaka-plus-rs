[package]
name = "mitaka-desktop"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true
default-run = "mitaka-plus"

[[bin]]
name = "mitaka-plus"
path = "src/main.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
wry = "0.57.3"
tao = "0.37"
tiny_http = "0.12"
http-range = "0.1"
scraper = "0.24"
same-file = "1"
interprocess = "2.4.9"
encoding_rs = "0.8"
command-group = "5"
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
tempfile = "3"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
fontdb = "0.23"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rfd = "0.15"
mitaka-core = { path = "../mitaka-core" }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
# Windowsの提示経路でもDX12バックエンドを明示する。
wgpu = { version = "24", default-features = false, features = ["dx12"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.27", features = ["socket"] }
