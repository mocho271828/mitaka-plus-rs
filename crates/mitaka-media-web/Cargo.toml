[package]
name = "mitaka-media-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mitaka-media-bindings"
path = "src/bin/bindings.rs"
required-features = ["generate"]

[features]
generate = ["dep:wasm-bindgen-cli-support"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasm-bindgen-cli-support = { version = "=0.2.130", optional = true, default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = ["Document", "Window", "Location", "HtmlMediaElement", "EventSource", "MessageEvent", "Event", "Request", "RequestInit", "Response"] }
js-sys = "=0.3.107"
wasm-bindgen-futures = "=0.4.80"
