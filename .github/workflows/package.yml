name: Distribution
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  MACOSX_DEPLOYMENT_TARGET: "13.0"
jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libx11-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libwebkit2gtk-4.1-dev libdbus-1-dev weston mesa-vulkan-drivers xvfb xauth pulseaudio pulseaudio-utils gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: bash tools/package.sh
      - name: Run the three executables extracted from the distribution
        shell: bash
        run: |
          cargo run --locked -p mitaka-core --example synthetic_chart -- package-test-data
          case "$RUNNER_OS" in
            macOS) ditto -x -k dist/*universal.zip "$RUNNER_TEMP/pkg"
                   app="$RUNNER_TEMP/pkg/Mitaka Plus.app/Contents/MacOS/mitaka-plus" ;;
            Linux) dpkg-deb -x dist/*.deb "$RUNNER_TEMP/pkg"
                   app="$RUNNER_TEMP/pkg/usr/bin/mitaka-plus" ;;
            Windows) 7z x -o"$RUNNER_TEMP/pkg" dist/*x64.zip
                     app="$RUNNER_TEMP/pkg/mitaka-plus/mitaka-plus.exe" ;;
          esac
          "$app" --inspect --data-root package-test-data
          if [[ "$RUNNER_OS" == Linux ]]; then
            bash tools/linux-display-test.sh "$app" package-test-data
          else
            "$app" --smoke-test --data-root package-test-data
          fi
          bin="$(dirname "$app")"
          ext=
          if [[ "$RUNNER_OS" == Windows ]]; then ext=.exe; fi
          printf 'assert(_VERSION == "Lua 5.4"); print("packaged Lua ready")\n' > package-test-data/probe.lua
          "$bin/mitaka-script$ext" package-test-data/probe.lua
          bash tools/test-media-player.sh "$bin/mitaka-media$ext" --release
      - if: runner.os == 'Linux'
        run: bash tools/offline-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mitaka-plus-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
